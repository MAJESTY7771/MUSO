<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AURA Pay — Mobile Wallet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Haqiqiy kamera orqali QR skanerlash kutubxonasi -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap');
    body { font-family: -apple-system, 'SF Pro Display', BlinkMacSystemFont, sans-serif; background: #000000; color: #ffffff; user-select: none; }
    .glass-card { background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.12); }
    .card-gradient-1 { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border: 1px solid rgba(255,255,255,0.15); }
    .card-gradient-2 { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); }
    #reader video { border-radius: 20px; object-fit: cover; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-5 max-w-md mx-auto">

  <!-- Header / Top Bar -->
  <header class="flex justify-between items-center py-2">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center font-bold text-sm"></div>
      <span class="font-semibold tracking-wide text-sm">AURA PAY</span>
    </div>
    <div class="text-xs text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20">
      Xavfsiz Tokenizatsiya
    </div>
  </header>

  <!-- Apple Wallet Kartasi -->
  <div class="my-6 space-y-4">
    <div class="card-gradient-1 rounded-3xl p-6 h-52 flex flex-col justify-between shadow-2xl relative overflow-hidden">
      <div class="flex justify-between items-start">
        <div>
          <p class="text-xs text-gray-400 font-medium">Karta balans</p>
          <h2 class="text-2xl font-bold mt-0.5">14,850,000 UZS</h2>
        </div>
        <span class="font-bold text-lg italic text-blue-400">VISA</span>
      </div>

      <div class="space-y-1">
        <p class="font-mono text-sm tracking-widest text-gray-300">•••• •••• •••• 8842</p>
        <div class="flex justify-between text-[10px] text-gray-400 uppercase">
          <span>DAN Token: 4092-DAN-8842</span>
          <span>09/28</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Boshqaruv Tugmasi -->
  <div class="space-y-3 mb-6">
    <button onclick="startScanner()" class="w-full py-4 bg-white text-black font-semibold rounded-2xl flex items-center justify-center space-x-2 shadow-lg active:scale-95 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m0 14v1m8-8h1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707"></path></svg>
      <span>QR Skanerlash (Kamera)</span>
    </button>
  </div>

  <!-- Real-Time Camera QR Scanner Modal -->
  <div id="scannerModal" class="fixed inset-0 bg-black/90 backdrop-blur-xl z-50 hidden flex flex-col justify-between p-6">
    <div class="flex justify-between items-center">
      <h3 class="font-semibold text-lg">QR Kodni Skanerlang</h3>
      <button onclick="stopScanner()" class="w-8 h-8 bg-white/10 rounded-full flex items-center justify-center text-gray-400">✕</button>
    </div>

    <div class="w-full max-w-sm mx-auto my-auto overflow-hidden rounded-3xl border border-white/20 shadow-2xl">
      <div id="reader"></div>
    </div>

    <p class="text-center text-xs text-gray-400">Terminal ekranidagi QR kodni kvadrat ichiga kiriting</p>
  </div>

  <!-- FaceID / To'lovni Tasdiqlash Modal -->
  <div id="payModal" class="fixed inset-0 bg-black/95 backdrop-blur-2xl z-50 hidden flex flex-col justify-between p-6">
    <div class="text-center pt-8">
      <p class="text-xs text-gray-400 uppercase tracking-widest mb-1">Toʻlov soʻrovi</p>
      <h2 id="modalAmount" class="text-4xl font-bold text-white mb-2">0 UZS</h2>
      <p id="modalSession" class="text-xs text-blue-400 font-mono"></p>
    </div>

    <!-- FaceID Animatsiyasi -->
    <div class="my-auto text-center space-y-4">
      <div class="w-24 h-24 border-2 border-blue-500/40 rounded-3xl mx-auto flex items-center justify-center relative overflow-hidden">
        <svg class="w-12 h-12 text-blue-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
      </div>
      <p class="text-xs text-gray-400">FaceID orqali autentifikatsiya</p>
    </div>

    <div class="space-y-3 pb-4">
      <button onclick="confirmPayment()" class="w-full py-4 bg-blue-600 hover:bg-blue-500 font-semibold rounded-2xl shadow-lg shadow-blue-600/30 transition text-white">
        Toʻlovni tasdiqlash
      </button>
      <button onclick="cancelPayment()" class="w-full py-3 text-gray-400 text-sm">Bekor qilish</button>
    </div>
  </div>

  <script>
    const channel = new BroadcastChannel('aura_pay_channel');
    let html5QrcodeScanner = null;
    let pendingSession = null;

    function startScanner() {
      document.getElementById('scannerModal').classList.remove('hidden');
      html5QrcodeScanner = new Html5Qrcode("reader");

      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess
      ).catch(err => {
        alert("Kamerani ochishda xatolik: " + err);
        stopScanner();
      });
    }

    function stopScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          document.getElementById('scannerModal').classList.add('hidden');
        }).catch(() => {
          document.getElementById('scannerModal').classList.add('hidden');
        });
      } else {
        document.getElementById('scannerModal').classList.add('hidden');
      }
    }

    function onScanSuccess(decodedText) {
      try {
        const data = JSON.parse(decodedText);
        if (data.sessionId && data.amount) {
          pendingSession = data;
          stopScanner();

          document.getElementById('modalAmount').innerText = data.amount.toLocaleString('uz-UZ') + ' UZS';
          document.getElementById('modalSession').innerText = 'ID: ' + data.sessionId;
          document.getElementById('payModal').classList.remove('hidden');
        }
      } catch (e) {
        // Shunchaki format mos kelmagan QR kodlar bo'lsa o'tkazib yuboradi
      }
    }

    function confirmPayment() {
      if (!pendingSession) return;

      // Cryptogramma va Device Account Number (DAN) yaratish simulyatsiyasi (Apple Pay xavfsizlik standarti)
      const token = 'DAN-4092-' + Math.random().toString(36).substring(2, 8).toUpperCase();

      // Noutbukdagi Aura Terminalga to'g'ridan-to'g'ri signal yuborish
      channel.postMessage({
        type: 'PAYMENT_SUCCESS',
        sessionId: pendingSession.sessionId,
        token: token,
        timestamp: Date.now()
      });

      document.getElementById('payModal').classList.add('hidden');
      alert("Toʻlov muvaffaqiyatli amalga oshirildi!");
      pendingSession = null;
    }

    function cancelPayment() {
      pendingSession = null;
      document.getElementById('payModal').classList.add('hidden');
    }
  </script>
</body>
</html>
